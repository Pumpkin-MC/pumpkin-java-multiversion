[package]
name = "pumpkin-java-multiversion"
version = "0.1.0"
edition = "2024"
authors = ["Pumpkin Developer"]
description = "Multi-version Java Edition protocol support plugin for Pumpkin"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["plugin", "chunk"]
# The Pumpkin WASM plugin; without it the crate is just the translator, for use as a library
plugin = ["dep:pumpkin-plugin-api"]
# Chunk format conversion for older clients, outside WASM
chunk = ["dep:pumpkin-world"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2", optional = true }
pumpkin-protocol = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2" }
pumpkin-nbt = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2" }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
flate2 = "1.0"
uuid = { version = "1.26", default-features = false, features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
phf = { version = "0.11", features = ["macros"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin", branch = "master", version = "0.2", optional = true }
