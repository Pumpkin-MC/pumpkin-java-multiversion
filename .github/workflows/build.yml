name: Build Plugin

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip2
            artifact: pumpkin-java-multiversion-wasip2
            filename: pumpkin_java_multiversion.wasm
          - target: wasm32-wasip3
            artifact: pumpkin-java-multiversion-wasip3
            filename: pumpkin_java_multiversion-wasip3.wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Pumpkin dependency
        run: git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git ../Pumpkin

      # build.rs runs the data generator of server jars before 1.19.4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache extracted vanilla datapacks
        uses: actions/cache@v4
        with:
          path: assets/datapacks
          key: vanilla-datapacks-${{ hashFiles('build.rs', 'build/vanilla.rs') }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build WASM plugin (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pumpkin_java_multiversion.wasm" "dist/${{ matrix.filename }}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          compression-level: 9
          path: dist/${{ matrix.filename }}

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download built plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pumpkin-java-multiversion-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasm
          generate_release_notes: true
