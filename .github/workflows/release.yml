name: Release

on:
  push:
    tags:
      - "*"
      - "!nightly"
      - "!nightly*"
      - "!canary"
      - "!canary*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (optional, defaults to v<Cargo.toml version>)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_release:
    name: Build Release (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip2
            artifact: pumpkin-java-multiversion-wasip2
            filename: pumpkin_java_multiversion.wasm
          - target: wasm32-wasip3
            artifact: pumpkin-java-multiversion-wasip3
            filename: pumpkin_java_multiversion-wasip3.wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Pumpkin dependency
        run: git clone --depth 1 https://github.com/Pumpkin-MC/Pumpkin.git ../Pumpkin

      # build.rs runs the data generator of server jars before 1.19.4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache extracted vanilla datapacks
        uses: actions/cache@v4
        with:
          path: assets/datapacks
          key: vanilla-datapacks-${{ hashFiles('build.rs', 'build/vanilla.rs') }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build WASM plugin (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pumpkin_java_multiversion.wasm" "dist/${{ matrix.filename }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          compression-level: 9
          path: dist/${{ matrix.filename }}

  publish_release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
            TAG="v${VERSION}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined release tag: ${TAG}"

      - name: Download built plugin artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "pumpkin-java-multiversion-*"
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: |
            dist/*.wasm
            dist/checksums.sha256
          generate_release_notes: true
