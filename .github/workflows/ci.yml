name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy (WASM target)
        env:
          RUST_MIN_STACK: 33554432
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: Run Clippy (Host target)
        env:
          RUST_MIN_STACK: 33554432
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Compile & Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check native compilation
        env:
          RUST_MIN_STACK: 33554432
        run: cargo check --all-targets

      - name: Build WASM plugin (debug)
        env:
          RUST_MIN_STACK: 33554432
        run: cargo build --target wasm32-wasip2

      - name: Build WASM plugin (release)
        env:
          RUST_MIN_STACK: 33554432
        run: cargo build --release --target wasm32-wasip2

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for file in target/wasm32-wasip2/debug/*.wasm; do
            cp "$file" "release-assets/debug-$(basename "$file")"
          done
          for file in target/wasm32-wasip2/release/*.wasm; do
            cp "$file" "release-assets/release-$(basename "$file")"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-java-multiversion
          path: release-assets/

      - name: Create draft release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/wasm32-wasip2/debug/*.wasm
            target/wasm32-wasip2/release/*.wasm

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        env:
          RUST_MIN_STACK: 33554432
        run: cargo test --lib --verbose
